_target_: src.shift.manager.ShiftInterventionManager

mode: steer

blocks: []
steps: []

collector: null

controller:
  _target_: src.shift.steering.TokenWiseSteeringController

  vector_type: ${shift.vector_type}

  timing_mode: ${shift.vector_timing.mode}
  source_step: ${shift.vector_timing.source_step}
  step_indices: ${shift.vector_timing.steps}

  # Used only when timing_mode=custom.
  vector_paths: null

  vector_directory: ${shift.artifacts_root}/dit/vectors

  svm_normal_directory: >-
    ${shift.artifacts_root}/svm_training/classifiers

  block_indices: ${shift.artifact_blocks}

  operation: erase
  strength: 0.0
  use_classifier: false
  validate_runtime: false

  # ------------------------------------------
  # SHIFT Energy Restoration
  # ------------------------------------------
  restore_token_norm: true
  restore_eps: 1.0e-6
  expected_activation_location: transformer_block_output_text

  regularizer:
    _target_: src.shift.regularizer.BlockwiseSVMRegularizer

    classifier_directory: >-
      ${shift.artifacts_root}/svm_training/classifiers

    block_indices: ${shift.artifact_blocks}

    timing_mode: ${shift.classifier_timing.mode}
    source_step: ${shift.classifier_timing.source_step}
    step_indices: ${shift.classifier_timing.steps}

    eps: 1.0e-6
    eta_max: ${shift.eta_max}
    expected_activation_location: transformer_block_output_text

pooled_controller:
  _target_: src.shift.pooled.PooledSteeringController

  vector_path: >-
    ${shift.artifacts_root}/pooled/pooled/pooled_vector.pt

  target_embedding_path: >-
    ${shift.artifacts_root}/pooled/pooled/target_embedding.pt

  operation: erase
  strength: 0.0
  enabled: false

  similarity_mode: raw
  normalize_vector: false
  eps: 1.0e-8
