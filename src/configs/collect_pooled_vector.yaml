defaults:
  - model: flux_schnell
  - generation: schnell_512
  - dataset: cyberpunk_20
  - pipeline: pooled_vector_collection
  - _self_

seed: 0
device: cuda

target_prompt: "cyberpunk style"

# Root directory for Hydra logs and run_manifest.yaml.
run_dir: ${hydra:runtime.output_dir}

# Keep the existing nested artifact structure:
# artifacts/<concept>/pooled/pooled/*.pt
output_dir: ${run_dir}/pooled

hydra:
  run:
    dir: outputs/pooled_collection/${now:%Y-%m-%d}/${now:%H-%M-%S}

  job:
    chdir: false

  output_subdir: .hydra