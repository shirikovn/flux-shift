defaults:
  - model: flux_schnell
  - generation: schnell_512
  - intervention: collect_dit_artifacts
  - dataset: cyberpunk_smoke
  - pipeline: activation_collection
  - _self_

seed: 42000
device: cuda

output_dir: ${hydra:runtime.output_dir}

collection:
  vary_seed_between_pairs: true
  # Matches generator seeds 42000 + 10*i in the released extractor.
  seed_stride: 10

hydra:
  run:
    dir: outputs/collect/${now:%Y-%m-%d}/${now:%H-%M-%S}

  job:
    chdir: false

  output_subdir: .hydra
